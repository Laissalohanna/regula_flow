services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: regulaflow
      POSTGRES_PASSWORD: regulaflow
      POSTGRES_DB: regulaflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regulaflow -d regulaflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://regulaflow:regulaflow@db:5432/regulaflow
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
